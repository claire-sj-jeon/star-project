<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Star</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="form-screen" class="screen">
    <h1>Find Your Star</h1>

    <p class="question">1. What type of star do you like?</p>
    <div class="choices">
      <label><input type="radio" name="starType" value="blue">Blue &amp; blazing hot</label>
      <label><input type="radio" name="starType" value="golden">Golden, like the Sun</label>
      <label><input type="radio" name="starType" value="red_dwarf">Small &amp; deep red</label>
      <label><input type="radio" name="starType" value="red_giant">A huge red giant</label>
    </div>

    <p class="question">2. What will you name your star?</p>
    <input type="text" id="starName" maxlength="24" placeholder="Star name..." autocomplete="off">

    <p id="form-hint" class="hidden">please answer both questions ✦</p>

    <button id="submit-btn">Find my Star</button>
  </div>

  <div id="loading-screen" class="screen hidden">
    <div id="loading-text">finding your star...</div>
  </div>

  <div id="result-screen" class="screen hidden">
    <img id="result-card" alt="Your star">
    <div class="button-row">
      <a id="download-btn" download="my-star.jpg">Download image</a>
      <a id="club-btn" href="https://forms.cloud.microsoft/r/FGBhin9jii" target="_blank" rel="noopener">
        <span class="club-small">if you enjoyed this,</span>
        <span class="club-big">join ASTRO club!</span>
      </a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
